version: '2'
linters:
  default: all
  disable:
    # conflicts
    - contextcheck # conflicts with echo patterns
    - depguard # too complex to maintain with this app
    - gomoddirectives # required at the moment (see go.mod)
    - paralleltest # breaks some tests
    # retired
    - exhaustruct
    - gomodguard
    # the linters below are unwanted
    - nlreturn
    - noinlineerr
    - varnamelen
    - wsl
    - wsl_v5
    - dupl # FIX: temp
    - godox # FIX: remove
    - funlen # FIX: remove
  settings:
    cyclop:
      max-complexity: 20
    funlen:
      lines: 70
      statements: 50
      ignore-comments: true
    gosec:
      excludes:
        - G203
    misspell:
      locale: US
      ignore-rules:
        - Teh
    sloglint:
      attr-only: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - .HTML(
        - .Inline(
        - .JSON(
        - .JSONPretty(
        - .Redirect(
        - .Render(
        - .String(
        - .Text(
        - app.StatusErr(
      ignore-package-globs:
        - github.com/aarondl/sqlboiler/v4/*
        - github.com/aarondl/sqlboiler/*
        - github.com/Defacto2/server/internal/postgres/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
        path: ^model/files\.go$
      # UNIT & GO TESTS
      - linters:
          - cyclop
          - dogsled
          - dupl
          - exhaustive
          - exhaustruct_v5
          - funlen
          - goconst
          - gochecknoglobals
          - gochecknoinits
          - gocyclo
          - ireturn
          - lll
          - misspell
          - mnd
          - tagliatelle
          - wrapcheck
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
